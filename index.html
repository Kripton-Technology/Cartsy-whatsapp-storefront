<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020402" />
    <meta name="color-scheme" content="light dark" />
    <script>
      {
        const colorScheme = localStorage.getItem("color-scheme");
        if (colorScheme === "light" || (!colorScheme && !window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="color-scheme"]').content = "light";
        } else {
          document.documentElement.classList.remove("light");
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="color-scheme"]').content = "dark";
        }
      }
    </script>
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- SEO: base/fallback meta tags – per-store pages get dynamic tags injected by the Express server -->
    <title>Cartsy — Social Media Storefront & WhatsApp Orders</title>
    <meta name="description" content="Sell through Instagram, TikTok, Snapchat and WhatsApp with instant order backups. No customer accounts, zero-friction tap-and-send checkout." />

    <meta property="og:site_name" content="Cartsy" />

    <meta property="og:description" content="Sell through Instagram, TikTok, Snapchat and WhatsApp with instant order backups. No customer accounts, zero-friction tap-and-send checkout." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Sell through Instagram, TikTok, Snapchat and WhatsApp with instant order backups. No customer accounts, zero-friction tap-and-send checkout." />
    <meta name="twitter:image" content="/pwa-512x512.png" />
  </head>
